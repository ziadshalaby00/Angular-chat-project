<ZS-modal
[title]="'Change Password'"
[(open)]="openChangePassModal"
(cancelEv)="openChangePassModal.set(false)"
(confirmEv)="changePass()"
[confirmConfig]="{
  btnStyle: 'warning',
  disabled: authApi.updateProfileLoading(),
  icon: authApi.updateProfileLoading() ? 'fa fa-spinner fa-spin' : ''
}"
[cancelConfig]="{
  disabled: authApi.updateProfileLoading(),
}"
[showCancelIcon]="!authApi.updateProfileLoading()"
[closeOnOverlay]="!authApi.updateProfileLoading()"
[modalStyle]="'warning'"
>
  <div class="flex flex-col gap-4 text-yellow-600 dark:text-yellow-500">
    <ZS-input
    [label]="'Old Password'"
    placeholder="Enter your password"

    icon="fas fa-lock"
    [type]="'password'"
    [inputStyle]="'warning'"

    [required]="true"
    (changedEv)="changeChPassValues($event, 'old_password')"

    [(touched)]="changePassForm.touched"
    >
    </ZS-input>

    <ZS-input #password
    [label]="'New Password'"
    placeholder="Enter the new password"

    icon="fas fa-lock"
    [type]="'password'"
    [inputStyle]="'warning'"

    [required]="true"
    (changedEv)="changeChPassValues($event, 'password')"

    [(touched)]="changePassForm.touched"
    >
    </ZS-input>

    <ZS-input #conf_password
    [label]="'Confirm New Password'"
    placeholder="Confirm the new password"

    [validateFns]="[confPassValidate]"

    icon="fas fa-lock"
    [type]="'password'"
    [inputStyle]="'warning'"

    [required]="true"
    (changedEv)="changeChPassValues($event, 'conf_password')"

    [(touched)]="changePassForm.touched"
    >
    </ZS-input>
  </div>
</ZS-modal>

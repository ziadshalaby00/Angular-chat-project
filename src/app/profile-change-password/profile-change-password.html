<ZS-modal
[title]="'Change Password'"
[(open)]="openChangePassModal"
(cancelEv)="openChangePassModal.set(false)"
(confirmEv)="changePass()"
[confirmConfig]="{
  text: 'Change',
  btnStyle: 'warning',
  disabled: authApi.updateProfileLoading(),
  iconTpl: authApi.updateProfileLoading() ? loaderIconTpl : null
}"
[cancelConfig]="{
  disabled: authApi.updateProfileLoading(),
}"
[showCancelIcon]="!authApi.updateProfileLoading()"
[closeOnOverlay]="!authApi.updateProfileLoading()"
[modalStyle]="'warning'"
>
  <div class="flex flex-col gap-4 text-yellow-600 dark:text-yellow-500">
    <ZS-input
    [label]="'Old Password'"
    placeholder="Enter your password"

    [iconTpl]="lockIcon"
    [type]="'password'"
    [inputStyle]="'warning'"

    [required]="true"
    (changedEv)="changeChPassValues($event, 'old_password')"

    [(value)]="changePassForm.fields.old_password().value"
    [(touched)]="changePassForm.fields.old_password().touched"
    >
    </ZS-input>

    <ZS-input #password
    [label]="'New Password'"
    placeholder="Enter the new password"

    [iconTpl]="lockIcon"
    [type]="'password'"
    [inputStyle]="'warning'"

    [required]="true"
    (changedEv)="changeChPassValues($event, 'password')"

    [(value)]="changePassForm.fields.password().value"
    [(touched)]="changePassForm.fields.password().touched"
    >
    </ZS-input>

    <ZS-input #conf_password
    [label]="'Confirm New Password'"
    placeholder="Confirm the new password"

    [validateFns]="[confPassValidate]"

    [iconTpl]="lockIcon"
    [type]="'password'"
    [inputStyle]="'warning'"

    [required]="true"
    (changedEv)="changeChPassValues($event, 'conf_password')"

    [(value)]="changePassForm.fields.conf_password().value"
    [(touched)]="changePassForm.fields.conf_password().touched"
    >
    </ZS-input>
  </div>
</ZS-modal>

<!-- Loader Icon -->
<ng-template #loaderIcon>
  <i class="fa fa-spinner fa-spin"></i>
</ng-template>
<!-- Loader Icon -->
<ng-template #lockIcon>
  <i class="fas fa-lock mr-1.5"></i>
</ng-template>

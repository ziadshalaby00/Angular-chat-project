<div>
  <app-navbar [(isMobileMenuOpen)]="isMobileMenuOpen"></app-navbar>
  <router-outlet></router-outlet>
  <ZS-footer></ZS-footer>
</div>

@if(!isMobileMenuOpen()) {
  <ZS-theme-toggle 
  [showDefaultUI]="themeService.quickTheme()"
  [setManualTheme]="themeService.theme()" 
  (themeChangeEv)="themeService.setTheme($event)"
  bodyClass="bg-slate-100 dark:bg-slate-800">
  </ZS-theme-toggle>
}


<div [ngClass]="[
  callService.currentCall()  ? 'block' : 'hidden'
]">
  <app-calling-page></app-calling-page>
</div>


<app-call></app-call>

<ZS-alert
[defaultShowCloseButton]="true"
[defaultAutoClose]="true"
[defaultDuration]="5000"
positionClass="top-17 right-1"
maxh="max-h-[calc(100vh-5.8rem)]"
></ZS-alert>

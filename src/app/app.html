<div class="">
  <app-navbar [(isMobileMenuOpen)]="isMobileMenuOpen"></app-navbar>
  <router-outlet></router-outlet>
  <ZS-footer></ZS-footer>
</div>

@if(!isMobileMenuOpen()) {
  <ZS-theme-toggle bodyClass="bg-sky-100 dark:bg-slate-800"></ZS-theme-toggle>
}

<!-- <ZS-scroll-to-top arrowProgressColor="violet"></ZS-scroll-to-top> -->

<ZS-alert
[defaultShowCloseButton]="true"
[defaultAutoClose]="true"
[defaultDuration]="5000"
positionClass="top-18 right-4"
maxh="max-h-[calc(100vh-5.8rem)]"
></ZS-alert>


<ZS-spinner
class="relative z-100"
[loading]='authService.verifyloading()'
type="bars"
[isFloating]='true'
color="emerald"
[withBox]="true"
boxColorClass="bg-slate-300/80 dark:bg-slate-800/80"
size="lg"
>
</ZS-spinner>

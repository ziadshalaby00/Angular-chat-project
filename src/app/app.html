<div class="min-h-screen">
    <app-navbar [(isMobileMenuOpen)]="isMobileMenuOpen"></app-navbar>
    <router-outlet></router-outlet>
    <ZS-footer></ZS-footer>
</div>

@if(!isMobileMenuOpen()) {
  <ZS-theme-toggle bodyClass="bg-sky-100 dark:bg-slate-800"></ZS-theme-toggle>
}

<ZS-scroll-to-top arrowProgressColor="violet"></ZS-scroll-to-top>

<ZS-alert
[defaultShowCloseButton]="true"
[defaultAutoClose]="true"
[defaultDuration]="6000"
></ZS-alert>

<ZS-spinner
[loading]='authService.verifyloading()'
type="bars"
[isFloating]='true'
color="indigo"
size="lg"
>
</ZS-spinner>

<div class="relative h-[calc(100vh-4rem)] w-full overflow-hidden bg-slate-900 dark:bg-black">
    <div class="absolute inset-0 flex items-center justify-center bg-slate-800 dark:bg-gray-900">
        <video
        #remoteVideo
        autoplay
        playsinline
        class="h-full w-full object-cover"
        ></video>
        @if (!remoteStream()) {
          <div class="absolute inset-0 flex items-center justify-center text-white/50 text-4xl font-light">
            <span>Connecting...</span>
          </div>
        }
    </div>

    <div class="absolute bottom-0 left-0 right-0 h-[40%] flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="relative w-full sm:max-w-[60%] max-w-[85%] max-h-[85%] aspect-video rounded-2xl overflow-hidden shadow-2xl border-2 border-white/20 mx-auto">
            <video
            #localVideo
            autoplay
            playsinline
            muted
            class="h-full w-full object-cover"
            ></video>
            <div class="absolute top-2 left-2 text-white/70 text-xs font-medium bg-black/40 px-2 py-0.5 rounded-full">
                You
            </div>
        </div>
    </div>

    <div class="absolute bottom-4 right-4 flex justify-center items-center gap-6 z-10">
        <button
            (click)="toggleMicrophone()"
            class="sm:size-14 size-10 rounded-full flex items-center justify-center sm:text-2xl text-lg transition-all duration-200 shadow-lg hover:scale-105 active:scale-95"
            [ngClass]="isMicrophoneOn() 
            ? 'bg-slate-700/80 text-white hover:bg-slate-600/80' 
            : 'bg-red-600/90 text-white hover:bg-red-700/90'"
        >
            <i [class]="isMicrophoneOn() ? 'fas fa-microphone' : 'fas fa-microphone-slash'"></i>
        </button>

        <button
            (click)="toggleCamera()"
            class="sm:size-14 size-10 rounded-full flex items-center justify-center sm:text-2xl text-lg transition-all duration-200 shadow-lg hover:scale-105 active:scale-95"
            [ngClass]="isCameraOn() 
            ? 'bg-slate-700/80 text-white hover:bg-slate-600/80' 
            : 'bg-red-600/90 text-white hover:bg-red-700/90'"
        >
            <i [class]="isCameraOn() ? 'fas fa-video' : 'fas fa-video-slash'"></i>
        </button>
    </div>

    <div class="absolute bottom-4 left-4 flex justify-center items-center gap-6 z-10">
        <button
            (click)="endCall()"
            class="sm:size-16 size-12 rounded-full bg-red-600 text-white sm:text-3xl text-xl flex items-center justify-center shadow-lg hover:bg-red-700 transition-all duration-200 hover:scale-105 active:scale-95"
        >
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>
</div>

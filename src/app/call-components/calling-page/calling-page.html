<div class="fixed top-0 left-0 z-10000 inset-0 
overflow-hidden bg-slate-900 dark:bg-black"
[ngClass]="[
    callService.isMinimized() ? 'size-0' : 'h-screen w-full'
]"
>
    <!-- Remote Video -->
    <div class="h-[60%] flex items-center justify-center bg-slate-800 dark:bg-gray-900 overflow-hidden">
        <div class="relative w-full aspect-video">
            <video
                #remoteVideo
                autoplay
                playsinline
                class="h-full w-full object-contain"
            ></video>

            @if (!remoteStream()) {
                <div class="absolute inset-0 flex items-center justify-center text-white/50 text-4xl font-light">
                    <span>Connecting...</span>
                </div>
            }
        </div>
    </div>

    <!-- Local Video -->
    <div class="h-[40%] flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="relative w-full sm:max-w-[60%] max-w-[90%] max-h-[90%] aspect-video rounded-2xl overflow-hidden shadow-2xl border-2 border-white/20 mx-auto">
            <video
                #localVideo
                autoplay
                playsinline
                muted
                class="h-full w-full object-contain"
            ></video>

            <div class="absolute top-2 left-2 text-white/70 text-xs font-medium bg-black/40 px-2 py-0.5 rounded-full">
                You
            </div>
        </div>
    </div>

    <div class="absolute bottom-4 right-4 flex justify-center items-center sm:gap-6 gap-3 z-10">
        <button
            (click)="switchCamera()"
            class="sm:size-14 size-10 rounded-full flex items-center justify-center sm:text-2xl text-lg transition-all duration-200 shadow-lg hover:scale-105 active:scale-95"
            [ngClass]="isFacingMode() 
            ? 'bg-green-700/80 text-white hover:bg-green-600/80' 
            : 'bg-blue-600/90 text-white hover:bg-blue-700/90'"
        >
            <i [class]="isFacingMode() ? 'fas fa-camera' : 'fas fa-camera-rotate'"></i>
        </button>

        <button
            (click)="toggleMicrophone()"
            class="sm:size-14 size-10 rounded-full flex items-center justify-center sm:text-2xl text-lg transition-all duration-200 shadow-lg hover:scale-105 active:scale-95"
            [ngClass]="isMicrophoneOn() 
            ? 'bg-slate-700/80 text-white hover:bg-slate-600/80' 
            : 'bg-red-600/90 text-white hover:bg-red-700/90'"
        >
            <i [class]="isMicrophoneOn() ? 'fas fa-microphone' : 'fas fa-microphone-slash'"></i>
        </button>

        <button
            (click)="toggleCamera()"
            class="sm:size-14 size-10 rounded-full flex items-center justify-center sm:text-2xl text-lg transition-all duration-200 shadow-lg hover:scale-105 active:scale-95"
            [ngClass]="isCameraOn() 
            ? 'bg-slate-700/80 text-white hover:bg-slate-600/80' 
            : 'bg-red-600/90 text-white hover:bg-red-700/90'"
        >
            <i [class]="isCameraOn() ? 'fas fa-video' : 'fas fa-video-slash'"></i>
        </button>
    </div>

    <div class="absolute bottom-4 left-4 flex justify-center items-center gap-6 z-10">
        <button
            (click)="endCall()"
            class="sm:size-16 size-12 rounded-full bg-red-600 text-white sm:text-3xl text-xl flex items-center justify-center shadow-lg hover:bg-red-700 transition-all duration-200 hover:scale-105 active:scale-95"
        >
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>

    <button
        type="button"
        class="absolute top-4 left-4 z-10
            flex h-10 w-10 items-center justify-center
            rounded-full
            border border-white/20
            bg-black/40
            text-white
            shadow-lg
            backdrop-blur-md
            transition-all duration-200
            hover:bg-black/60
            hover:scale-105
            active:scale-95
            focus:outline-none
            focus:ring-2 focus:ring-white/40"
        (click)="callService.isMinimized.set(true)"
        aria-label="Minimize call"
        title="Minimize"
    >
        <i class="fa-solid fa-down-left-and-up-right-to-center text-sm"></i>
    </button>
</div>




<div
    #miniVideo
    class="fixed z-10000
           w-48 aspect-video
           rounded-lg overflow-hidden
           shadow-xl
           cursor-grab
           active:cursor-grabbing
           select-none touch-none"
    [ngClass]="[
        callService.isMinimized()
            ? 'pointer-events-auto'
            : 'size-0 pointer-events-none'
    ]"
    [style.left.px]="miniPosition().x"
    [style.top.px]="miniPosition().y"
    (pointerdown)="startDragging($event)"
    (pointermove)="onDragging($event)"
    (pointerup)="stopDragging($event)"
    (pointercancel)="stopDragging($event)"
    (click)="restoreFromMini($event)"
>
    <video
        #remoteVideoMini
        autoplay
        playsinline
        class="h-full w-full object-contain pointer-events-none"
    ></video>
</div>

<div class="fixed top-0 left-0 z-10000 inset-0 h-screen w-full
overflow-hidden bg-slate-950 dark:bg-black"
[ngClass]="[
    callService.isMinimized() ? 'hidden' : 'block'
]"
>
    <!-- Videos Grid -->
    <div class="h-full w-full flex flex-col md:flex-row gap-1 p-1 bg-black">
        
        <!-- Remote Video -->
        <div class="flex-6/10 relative flex items-center justify-center bg-slate-900 dark:bg-gray-950 overflow-hidden rounded-xl">
            <div class="relative w-full h-full">
                <video
                    #remoteVideo
                    autoplay
                    playsinline
                    class="h-full w-full object-contain"
                ></video>

                @if (!remoteStream()) {
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-white/60 gap-3">
                        <div class="w-12 h-12 border-4 border-white/20 border-t-white/80 rounded-full animate-spin"></div>
                        <span class="text-lg font-medium">Connecting...</span>
                    </div>
                } 
                @if (remoteStream() && !chatsCallService.RemoteCamera()) {
                    <div class="absolute inset-0 flex items-center justify-center">
                        <!-- User Avatar -->
                        <app-user-avatar
                        [participant]="{user_info: callService.OntherUser()!}"
                        [isCurrentChat]="true"
                        size="sm:size-56 sm:min-w-56 size-32 min-w-32 sm:text-[110px] text-[72px]"
                        >
                        </app-user-avatar>
                    </div>
                }
            </div>
        </div>

        <!-- Local Video -->
        <div class="flex-4/10 relative flex items-center justify-center bg-slate-900 dark:bg-gray-950 overflow-hidden rounded-xl">
            <div class="relative w-full h-full">
                <video
                    #localVideo
                    autoplay
                    playsinline
                    muted
                    class="h-full w-full object-contain"
                ></video>

                <div class="absolute inset-0 flex items-center justify-center">
                    @if(!isCameraOn()) {
                        <!-- User Avatar -->
                        <app-user-avatar
                        [participant]="{user_info: my()}"
                        [isCurrentChat]="true"
                        size="sm:size-56 sm:min-w-56 size-32 min-w-32 sm:text-[110px] text-[72px]"
                        >
                        </app-user-avatar>
                    }
                </div>

                <!-- Local User Label -->
                <div class="absolute top-3 left-3 text-white/80 text-sm font-medium bg-black/50 px-3 py-1 rounded-full backdrop-blur-sm border border-white/10">
                    <i class="fas fa-user mr-1.5 text-xs"></i>You
                </div>
            </div>
        </div>
    </div>

    <!-- Controls Bar -->
    <div class="absolute sm:bottom-6 bottom-12 left-1/2 -translate-x-1/2 flex items-center gap-4 z-20 bg-black/40 backdrop-blur-xl px-6 py-3 rounded-full border border-white/10 shadow-2xl">
        
        <!-- Switch Camera -->
        <button
            (click)="switchCamera()"
            class="w-12 h-12 rounded-full flex items-center justify-center text-lg transition-all duration-200 shadow-lg hover:scale-110 active:scale-90"
            [ngClass]="isFacingMode() 
            ? 'bg-emerald-600/90 text-white hover:bg-emerald-500' 
            : 'bg-blue-600/90 text-white hover:bg-blue-500'"
            title="Switch Camera"
        >
            <i [class]="isFacingMode() ? 'fas fa-camera' : 'fas fa-camera-rotate'"></i>
        </button>

        <!-- Toggle Microphone -->
        <button
            (click)="toggleMicrophone()"
            class="w-12 h-12 rounded-full flex items-center justify-center text-lg transition-all duration-200 shadow-lg hover:scale-110 active:scale-90"
            [ngClass]="isMicrophoneOn() 
            ? 'bg-slate-700/90 text-white hover:bg-slate-600' 
            : 'bg-red-600/90 text-white hover:bg-red-500'"
            title="Toggle Microphone"
        >
            <i [class]="isMicrophoneOn() ? 'fas fa-microphone' : 'fas fa-microphone-slash'"></i>
        </button>

        <!-- Toggle Camera -->
        <button
            (click)="toggleCamera()"
            class="w-12 h-12 rounded-full flex items-center justify-center text-lg transition-all duration-200 shadow-lg hover:scale-110 active:scale-90"
            [ngClass]="isCameraOn() 
            ? 'bg-slate-700/90 text-white hover:bg-slate-600' 
            : 'bg-red-600/90 text-white hover:bg-red-500'"
            title="Toggle Camera"
        >
            <i [class]="isCameraOn() ? 'fas fa-video' : 'fas fa-video-slash'"></i>
        </button>

        <!-- End Call -->
        <button
            (click)="endCall()"
            class="w-14 h-14 rounded-full bg-red-600 text-white text-xl flex items-center justify-center shadow-lg hover:bg-red-500 transition-all duration-200 hover:scale-110 active:scale-90"
            title="End Call"
        >
            <i class="fas fa-phone-slash"></i>
        </button>
    </div>

    <!-- Minimize Button -->
    <button
        type="button"
        class="absolute top-4 left-4 z-20
            flex h-10 w-10 items-center justify-center
            rounded-full
            border border-white/20
            bg-black/40
            text-white
            shadow-lg
            backdrop-blur-md
            transition-all duration-200
            hover:bg-black/60
            hover:scale-105
            active:scale-95
            focus:outline-none
            focus:ring-2 focus:ring-white/40"
        (click)="callService.isMinimized.set(true)"
        aria-label="Minimize call"
        title="Minimize"
    >
        <i class="fa-solid fa-down-left-and-up-right-to-center text-sm"></i>
    </button>
</div>




<!-- Minimized View -->
<div
    #miniVideo
    class="fixed z-10000
           w-48 sm:w-72 aspect-video
           rounded-lg overflow-hidden
           shadow-2xl
           cursor-grab
           active:cursor-grabbing
           select-none touch-none
           border border-white/20"
    [ngClass]="[
        callService.isMinimized()
            ? 'pointer-events-auto block'
            : 'hidden pointer-events-none'
    ]"
    [style.left.px]="miniPosition().x"
    [style.top.px]="miniPosition().y"
    (pointerdown)="startDragging($event)"
    (pointermove)="onDragging($event)"
    (pointerup)="stopDragging($event)"
    (pointercancel)="stopDragging($event)"
>
    <video
        #remoteVideoMini
        autoplay
        playsinline
        class="h-full w-full object-contain pointer-events-none"
    ></video>

    @if (remoteStream() && !chatsCallService.RemoteCamera()) {
        <div class="absolute inset-0 flex items-center justify-center">
            <!-- User Avatar -->
            <app-user-avatar
            [participant]="{user_info: callService.OntherUser()!}"
            [isCurrentChat]="true"
            size="sm:size-24 sm:min-w-24 sm:text-[56px] size-18 min-w-18 text-[32px]"
            >
            </app-user-avatar>
        </div>
    }

    <div
        class="absolute top-1.5 left-1.5
               text-white/70 text-[10px] font-medium
               bg-black/50 px-1.5 py-0.5 rounded
               backdrop-blur-sm cursor-pointer
               pointer-events-auto"
        (pointerdown)="$event.stopPropagation()"
        (click)="restoreFromMini($event)"
    >
        <i class="fas fa-expand mr-1"></i>
        Tap to expand
    </div>
</div>

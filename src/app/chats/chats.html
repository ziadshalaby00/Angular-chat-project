<div class="h-[85vh] flex dark:text-gray-50">
    <ZS-sidebar
    header="Chats"
    [floating]="false"
    [openSide]="true"
    class='h-[85vh] bg-blue-300/80 dark:bg-blue-800/60'
    >
        <div main class="flex flex-col h-full gap-4 pt-4 pb-5 pl-1.5 pr-3">
            <div class="px-3">
                <ZS-input
                placeholder="Search for chat..."
                type="search"
                inputStyle="primary"
                [showLoaderIconOnSearchInput]="true"
                (searchEv)="onSearchForChat($event)"
                >
                </ZS-input>
            </div>
            <div class='flex flex-col gap-4 h-full pt-2 pb-6 px-3 overflow-y-auto scroll scroll-success'>
                @for(item of ['ziad', 'ahmed', 'salah']; track item) {
                    @if(item === 'ahmed') {
                        <ZS-card
                        [clickable]="true"
                        cardStyle="success"
                        bodyClass="bg-green-300 dark:bg-green-700"
                        >
                            <div class="py-4 px-6">
                                {{ item }}
                            </div>
                        </ZS-card>
                    }@else {
                        <ZS-card
                        [clickable]="true"
                        cardStyle="success"
                        >
                            <div class="py-4 px-6">
                                {{ item }}
                            </div>
                        </ZS-card>
                    }
                }
            </div>
        </div>
    </ZS-sidebar>

    <!-- Chating -->
    <div class="w-full h-full">
        <app-chat></app-chat>
    </div>
</div>

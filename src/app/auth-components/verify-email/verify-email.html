<div class="min-h-[calc(100vh-10.25rem)] flex justify-center items-center m-4">
    @if (authApi.verifyEmailLoading()) {
        <ZS-spinner
            [loading]="true"
            [isFloating]="true"
            type="pro"
            size="lg"
            color="blue"
            [withBox]="true"
        />
    } @else if (authApi.verifyEmailError()) {
        <div class="w-full max-w-md text-center">

            <h2 class="text-xl font-semibold mb-2">
                Email Verification Failed
            </h2>

            <p class="text-gray-500 mb-8">
                This verification link is invalid or has expired.
            </p>

            <app-resend-ver-link></app-resend-ver-link>
        </div>
    }
</div>

<!-- Envelope Icon -->
<ng-template #envelopeIcon>
    <i class="fas fa-envelope mr-1.5"></i>
</ng-template>

<!-- Loader Icon -->
<ng-template #loaderIcon>
    <i class="fa fa-spinner fa-spin"></i>
</ng-template>

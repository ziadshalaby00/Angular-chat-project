<!-- signup.component.html -->
<div class="min-h-[calc(100vh-8.25rem)] flex justify-center items-center m-4">
  <ZS-card
  class="w-full max-w-120"
  bodyClass="bg-white dark:bg-slate-900"
  cardStyle='violet'
  >
    <form (submit)="submit($event)" class="p-6 flex flex-col gap-4 text-slate-800 
    dark:text-slate-300" novalidate>
        <!-- Header with Logo/Icon -->
        <div class="flex flex-col items-center mb-2">
          <div class="w-16 h-16 mb-4 rounded-full bg-linear-to-br from-violet-500 
          to-purple-600 flex items-center justify-center shadow-lg">
            <i class="fas fa-user-plus text-2xl text-white"></i>
          </div>
          <h2 class="text-3xl font-bold bg-linear-to-r from-violet-700 to-purple-600 
          dark:from-violet-400 dark:to-purple-300 bg-clip-text text-transparent">
            Create Account
          </h2>
          <p class="text-slate-600 dark:text-slate-400 text-center mt-2 text-sm">
            Join our community and start your journey
          </p>
        </div>
  
        <ZS-input
          [label]="'Full Name'"
          [placeholder]="'Enter your full name'"
          [iconTpl]="userIcon"
  
          (changedEv)="changeValues($event, 'fullname')"
          [(touched)]="form.fields.fullname().touched"
  
          [type]="'text'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Username'"
          [hint]="'Enter a unique username.'"
          [placeholder]="'Enter your username'"
          [iconTpl]="userIcon"
  
          (changedEv)="changeValues($event, 'username')"
          [(touched)]="form.fields.username().touched"
  
          [type]="'text'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Email'"
          [hint]="'Enter a unique email.'"
          [placeholder]="'Enter your email'"
          [iconTpl]="envelopeIcon"
  
          (changedEv)="changeValues($event, 'email')"
          [(touched)]="form.fields.email().touched"
  
          [type]="'email'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input #password
          [label]="'Password'"
          [placeholder]="'Enter password'"
          [iconTpl]="lockIcon"
  
          (changedEv)="changeValues($event, 'password')"
          [(touched)]="form.fields.password().touched"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input #conf_password
          [label]="'Confirm Password'"
          [placeholder]="'Confirm password'"
          [iconTpl]="lockIcon"
  
          (changedEv)="changeValues($event, 'conf_password')"
          [(touched)]="form.fields.conf_password().touched"
          [validateFns]="[confPassValidate]"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
    
        <!-- Terms and Conditions -->
        <div class="flex items-start gap-3 p-3 bg-slate-50 dark:bg-slate-800/50 rounded-lg">
          <input 
            type="checkbox" 
            id="terms"
            class="mt-1 w-4 h-4 bg-gray-100 border-gray-300 rounded 
            dark:ring-offset-gray-800  dark:bg-gray-700 dark:border-gray-600"
          >
          <label for="terms" class="text-sm text-slate-600 dark:text-slate-400">
            I agree to the 
            <a class="text-violet-600 hover:text-violet-700 dark:text-violet-400 
            dark:hover:text-violet-300 font-medium">
              Terms of Service
            </a> 
            and 
            <a class="text-violet-600 hover:text-violet-700 dark:text-violet-400 
            dark:hover:text-violet-300 font-medium">
              Privacy Policy
            </a>
          </label>
        </div>
        
        <div class="mt-4 flex flex-col gap-2">
          <ZS-button
          size="lg"
          btnStyle="violet"
          [type]="'submit'"
          [disabled]="authApi.googleLoading() || authApi.signupLoading()"
          [iconTpl]="authApi.signupLoading() ? loaderIcon : undefined"
          >
            Sign Up
          </ZS-button>
  
          <!-- or -->
          <app-or></app-or>
  
          <ZS-button
          (clickedEv)="google()"
          size="lg"
          btnStyle="secondary"
          variant="outline"
          [type]="'button'"
          [disabled]="authApi.googleLoading() || authApi.signupLoading()"
          [iconTpl]="authApi.googleLoading() ? loaderIcon : googleIcon"
          >
            Sign Up With Google
          </ZS-button>
        </div>
    
        <div class="flex flex-wrap justify-center items-center gap-1.5 text-sm">
          <span class="text-gray-700 dark:text-gray-300">
            Already have an account?
          </span>
          <button
          type="button"
          class="text-blue-600 hover:text-blue-500 dark:text-blue-400"
          (click)="router.navigate(['/login'])"
          >
          Login
          </button>
        </div>
    </form>
  </ZS-card>
</div>

<!-- Loader Icon -->
<ng-template #loaderIcon>
  <i class="fa fa-spinner fa-spin"></i>
</ng-template>
<!-- Google Icon -->
<ng-template #googleIcon>
  <i class="fa-brands fa-google"></i>
</ng-template>

<!-- User Icon -->
<ng-template #userIcon>
  <i class="fas fa-user mr-1.5"></i>
</ng-template>
<!-- Envelope Icon -->
<ng-template #envelopeIcon>
  <i class="fas fa-envelope mr-1.5"></i>
</ng-template>
<!-- Lock Icon -->
<ng-template #lockIcon>
  <i class="fas fa-lock mr-1.5"></i>
</ng-template>

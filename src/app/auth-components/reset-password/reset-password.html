<div class="min-h-[calc(100vh-10.25rem)] flex justify-center items-center m-4">
  <ZS-card
  class="w-full max-w-120"
  bodyClass="bg-white dark:bg-slate-900"
  cardStyle='info'
  >
    <form (submit)="submit($event)" novalidate class="p-6 flex flex-col gap-4 text-slate-800 dark:text-slate-300">
        <!-- Header Section -->
        <div class="text-center mb-2">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-linear-to-r from-sky-500 to-blue-600 mb-4">
            <i class="fas fa-key text-2xl text-white"></i>
          </div>
          <h2 class="text-3xl font-bold text-sky-800 dark:text-sky-300 mb-2">Reset Password</h2>
          <p class="text-slate-600 dark:text-slate-400 text-sm">Create a new strong password for your account</p>
        </div>
      
         <ZS-input #pass
          [label]="'New Password'"
          [placeholder]="'Enter password'"
          [iconTpl]="lockIcon"
  
          (changedEv)="changeValues($event, 'new_password')"
          [(touched)]="form.fields.new_password().touched"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'info'"
        ></ZS-input>
      
        <ZS-input #conf_pass
          [label]="'Confirm Password'"
          [placeholder]="'Confirm password'"
          [iconTpl]="lockIcon"
  
          (changedEv)="changeValues($event, 'conf_pass')"
          [(touched)]="form.fields.conf_pass().touched"
          [validateFns]="[confPassValidate]"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'info'"
        ></ZS-input>
  
      <ZS-button
      class="mt-2"
      size="lg"
      btnStyle="info"
      [type]="'submit'"
      [disabled]="authApi.passwordResetConfirmLoading()"
      [iconTpl]="authApi.passwordResetConfirmLoading()? loaderIcon : undefined"
      >
          Reset
      </ZS-button>
    </form>
  </ZS-card>
</div>

<!-- Loader Icon -->
<ng-template #loaderIcon>
  <i class="fa fa-spinner fa-spin"></i>
</ng-template>

<!-- Lock Icon -->
<ng-template #lockIcon>
  <i class="fas fa-lock mr-1.5"></i>
</ng-template>

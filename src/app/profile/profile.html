<div class="min-h-[85vh] flex items-center justify-center p-4">
    <div class="w-[400px] bg-sky-200 rounded-lg">
        <div class="flex flex-col items-center gap-4 p-4">
            <img [src]="authService.userData()?.user_image" alt="" class="size-46 rounded-full">
            <h2 class="text-3xl font-semibold">{{ authService.userData()?.fullname }}</h2>
            <h3 class="text-xl"> {{ authService.userData()?.username }} </h3>
        </div>
        <hr>
        <div class="flex flex-col items-center gap-4 p-4">
            Email: {{ authService.userData()?.email }}
            Last Login: {{ authService.userData()?.last_login }}
            Date Joined {{ authService.userData()?.date_joined }}
        </div>
        <hr>
        <div class="flex flex-col gap-4 p-4">
            <ZS-button
            [btnStyle]="'secondary'"
            >
            Edit Account
            </ZS-button>
            <ZS-button
            [btnStyle]="'danger'"
            [variant]="'outline'"
            >
            Delete Account
            </ZS-button>
        </div>
    </div>
</div>

<!-- signup.component.html -->
<div class="min-h-[90vh] flex justify-center items-center m-4">
  <ZS-card 
  class="w-full max-w-120"
  bodyClass="bg-white dark:bg-slate-900"
  cardStyle='violet'
  >
    <form (submit)="submit($event)" class="p-6 flex flex-col gap-4 text-slate-800 dark:text-slate-300" novalidate>
        <h2 class="text-2xl text-center font-bold mb-4 text-violet-800 dark:text-violet-300">Sign Up</h2>
  
        <ZS-input
          [label]="'Full Name'"
          [placeholder]="'Enter your full name'"
          [iconTpl]="userIcon"
  
          (changedEv)="changeValues($event, 'fullname')"
          [(touched)]="form.fields.fullname().touched"
  
          [type]="'text'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Username'"
          [hint]="'Enter a unique username.'"
          [placeholder]="'Enter your username'"
          [iconTpl]="userIcon"
  
          (changedEv)="changeValues($event, 'username')"
          [(touched)]="form.fields.username().touched"
  
          [type]="'text'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input
          [label]="'Email'"
          [hint]="'Enter a unique email.'"
          [placeholder]="'Enter your email'"
          [iconTpl]="envelopeIcon"
  
          (changedEv)="changeValues($event, 'email')"
          [(touched)]="form.fields.email().touched"
  
          [type]="'email'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input #password
          [label]="'Password'"
          [placeholder]="'Enter password'"
          [iconTpl]="lockIcon"
  
          (changedEv)="changeValues($event, 'password')"
          [(touched)]="form.fields.password().touched"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
      
        <ZS-input #conf_password
          [label]="'Confirm Password'"
          [placeholder]="'Confirm password'"
          [iconTpl]="lockIcon"
  
          (changedEv)="changeValues($event, 'conf_password')"
          [(touched)]="form.fields.conf_password().touched"
          [validateFns]="[confPassValidate]"
  
          [type]="'password'"
          [required]="true"
          [inputStyle]="'violet'"
        ></ZS-input>
    
        
        <div class="mt-4 flex flex-col gap-2">
          <ZS-button
          size="lg"
          btnStyle="violet"
          [type]="'submit'"
          [disabled]="authApi.googleLoading() || authApi.signupLoading()"
          [iconTpl]="authApi.signupLoading() ? loaderIcon : undefined"
          >
            Sign Up
          </ZS-button>
  
          <!-- or -->
          <app-or></app-or>
  
          <ZS-button
          (clickedEv)="google()"
          size="lg"
          btnStyle="secondary"
          variant="outline"
          [type]="'button'"
          [disabled]="authApi.googleLoading() || authApi.signupLoading()"
          [iconTpl]="authApi.googleLoading() ? loaderIcon : googleIcon"
          >
            Sign Up With Google
          </ZS-button>
        </div>
    
        <div class="flex flex-wrap justify-center items-center gap-1.5 text-sm">
          <span class="text-gray-700 dark:text-gray-300">
            Already have an account?
          </span>
          <button
          type="button"
          class="text-blue-600 hover:text-blue-500 dark:text-blue-400"
          (click)="router.navigate(['/login'])"
          >
          Login
          </button>
        </div>
    </form>
  </ZS-card>
</div>

<!-- Loader Icon -->
<ng-template #loaderIcon>
  <i class="fa fa-spinner fa-spin"></i>
</ng-template>
<!-- Google Icon -->
<ng-template #googleIcon>
  <i class="fa-brands fa-google"></i>
</ng-template>

<!-- User Icon -->
<ng-template #userIcon>
  <i class="fas fa-user mr-1.5"></i>
</ng-template>
<!-- Envelope Icon -->
<ng-template #envelopeIcon>
  <i class="fas fa-envelope mr-1.5"></i>
</ng-template>
<!-- Lock Icon -->
<ng-template #lockIcon>
  <i class="fas fa-lock mr-1.5"></i>
</ng-template>

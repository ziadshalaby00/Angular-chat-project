<ZS-navbar
  [logoUrl]="logoUrl"
  [siteNameConfig]="siteNameConfig"

  [authButtons]="authButtons"
  [showUserSection]="true"

  [navItems]="navItems()"
  [mobileMode]="'sm'"

  [isLoggedIn]="authApi.isLoggedin()"
  [userProfile]="navUserProfile()"
  [userMenuItems]="userMenuItems()"

  (loginClickedEv)="onLogin()"
  (signupClickedEv)="onSignup()"

  (anyItemClickedEv)="anyItemClickedEv($event)"

  [(isMobileMenuOpen)]="isMobileMenuOpen"
  [(isUserMenuOpen)]="isUserMenuOpen"
  [(isMoreOpen)]="isMoreOpen"
></ZS-navbar>

<!-- Icons -->
<!-- Home Icon -->
<ng-template #homeIcon>
  <i class="fa-solid fa-house mr-1.5"></i>
</ng-template>

<!-- Logout Icon -->
<ng-template #logoutIcon>
  <div class="flex items-center justify-center text-xl mr-2 ml-0.5">
    <i class="fas fa-sign-out-alt"></i>
  </div>
</ng-template>

<!-- Themes Icons -->
<!-- Light Icon -->
<ng-template #lightIcon>
  <div class="flex items-center justify-center gap-2.5 mr-1.5">
    <i class="text-lg"
    [ngClass]="[
      themeService.theme() === 'light' 
      ? 'fa-solid fa-circle-check' 
      : 'fa-regular fa-circle'
    ]"
    ></i>
    <i class="fas fa-sun text-yellow-500 
    group-hover:text-yellow-600 
    dark:group-hover:text-yellow-400"></i>
  </div>
</ng-template>
<!-- Dark Icon -->
<ng-template #darkIcon>
  <div class="flex items-center justify-center gap-2.5 mr-1.5">
    <i class="fa-regular text-lg"
    [ngClass]="[
      themeService.theme() === 'dark' 
      ? 'fa-solid fa-circle-check' 
      : 'fa-regular fa-circle'
    ]"
    ></i>
    <i class="fas fa-moon ml-0.5"></i>
  </div>
</ng-template>
<!-- Quick Theme -->
<ng-template #quickThemeIcon>
  <div class="flex items-center justify-center text-2xl mr-2">
    <i
    [ngClass]="[
      themeService.quickTheme() 
      ? 'fa-solid fa-toggle-on' 
      : 'fa-solid fa-toggle-off'
    ]"
    ></i>
  </div>
</ng-template>

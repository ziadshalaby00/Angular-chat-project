<ZS-navbar
  [logoUrl]="logoUrl"
  [siteNameConfig]="siteNameConfig"

  [authButtons]="authButtons"
  [showUserSection]="true"

  [navItems]="navItems()"
  [mobileMode]="'sm'"

  [isLoggedIn]="authApi.isLoggedin()"
  [userProfile]="navUserProfile()"
  [userMenuItems]="userMenuItems()"

  (loginClickedEv)="onLogin()"
  (signupClickedEv)="onSignup()"

  (anyItemClickedEv)="anyItemClickedEv($event)"

  [(isMobileMenuOpen)]="isMobileMenuOpen"
  [(isUserMenuOpen)]="isUserMenuOpen"
  [(isMoreOpen)]="isMoreOpen"
></ZS-navbar>

<!-- Enhanced Icons -->
<!-- Home Icon -->
<ng-template #homeIcon>
    <div class="size-6 mr-1.5 flex items-center justify-center">
      <i class="fa-solid fa-house-chimney transition-transform duration-200"></i>
    </div>
</ng-template>

<!-- Profile Icon -->
<ng-template #profileIcon>
    <div class="relative size-8 mr-2.5 flex items-center justify-center group">
        <div class="absolute inset-0 bg-linear-to-br from-blue-500/20 
        to-indigo-500/20 dark:from-blue-500/30 dark:to-indigo-500/30 
        rounded-full group-hover:scale-110 transition-transform duration-200"></div>

        <div class="relative z-10 size-7 rounded-full bg-linear-to-br from-blue-100 
        to-blue-200 dark:from-blue-900/40 dark:to-blue-800/40 flex items-center 
        justify-center group-hover:from-blue-200 group-hover:to-blue-300 
        dark:group-hover:from-blue-800/60 dark:group-hover:to-blue-700/60 
        transition-all duration-300">
          <i class="fa-solid fa-user text-blue-600 dark:text-blue-400 
          group-hover:text-blue-700 dark:group-hover:text-blue-300 
          transition-colors duration-300"></i>
        </div>
    </div>
</ng-template>

        transition-transform duration-200"></div>

        to-purple-200 dark:from-purple-900/40 dark:to-purple-800/40 flex items-center

<!-- Logout Icon -->
<ng-template #logoutIcon>
    <div class="relative size-8.5 mr-2 ml-px flex items-center justify-center group">
      <div class="absolute inset-0 bg-linear-to-br from-red-500/10 to-rose-500/10 
      dark:from-red-500/20 dark:to-rose-500/20 rounded-full group-hover:scale-110 
      transition-transform duration-200"></div>

      <i class="fa-solid fa-right-from-bracket text-red-600 dark:text-red-400 
      group-hover:text-red-700 dark:group-hover:text-red-300 relative z-10
      transition-colors duration-300"></i>
    </div>
</ng-template>

<!-- Themes Icons -->
<!-- Light Icon -->
<ng-template #lightIcon>
    <div class="flex items-center justify-center gap-3 mr-1.5 group">
        <div class="relative">
            <i class="text-2xl transition-all duration-300"
              [ngClass]="[
                  themeService.theme() === 'light' 
                  ? 'fa-solid fa-circle-check text-green-500 dark:text-green-400' 
                  : 'fa-regular fa-circle text-gray-400 dark:text-gray-500 
                    group-hover:text-gray-600 dark:group-hover:text-gray-400'
              ]"></i>
        </div>
        <div class="relative size-6 flex items-center justify-center">
            <div class="absolute inset-0 bg-linear-to-br from-yellow-500/10 
            to-amber-500/10 dark:from-yellow-500/20 dark:to-amber-500/20 
            rounded-full group-hover:scale-110 transition-transform duration-200"></div>

            <i class="fas fa-sun text-sm text-yellow-500 dark:text-yellow-400 
            group-hover:text-yellow-600 dark:group-hover:text-yellow-300 
            relative z-10 transition-colors duration-300"></i>
        </div>
    </div>
</ng-template>

<!-- Dark Icon -->
<ng-template #darkIcon>
    <div class="flex items-center justify-center gap-3 mr-1.5 group">
        <div class="relative">
            <i class="text-2xl transition-all duration-300"
              [ngClass]="[
                  themeService.theme() === 'dark' 
                  ? 'fa-solid fa-circle-check text-indigo-500 dark:text-indigo-400' 
                  : 'fa-regular fa-circle text-gray-400 dark:text-gray-500 
                    group-hover:text-gray-600 dark:group-hover:text-gray-400'
              ]"></i>
        </div>
        <div class="relative size-6 flex items-center justify-center">
            <div class="absolute inset-0 bg-linear-to-br from-indigo-500/10 
            to-purple-500/10 dark:from-indigo-500/20 dark:to-purple-500/20 
            rounded-full group-hover:scale-110 transition-transform duration-200"></div>

            <i class="fas fa-moon text-sm text-indigo-600 dark:text-indigo-400 
            group-hover:text-indigo-700 dark:group-hover:text-indigo-300 relative 
            z-10 transition-colors duration-300 ml-0.5"></i>
        </div>
    </div>
</ng-template>

<!-- Quick Theme -->
<ng-template #quickThemeIcon>
    <div class="mr-2 flex items-center justify-center group">
        <div class="transform transition-transform duration-500 group-hover:rotate-12">
            <i class="text-2xl transition-all duration-300"
              [ngClass]="[
                  themeService.quickTheme() 
                  ? 'fa-solid fa-toggle-on text-teal-600 dark:text-teal-400 group-hover:text-teal-700 dark:group-hover:text-teal-300' 
                  : 'fa-solid fa-toggle-off text-gray-400 dark:text-gray-500 group-hover:text-gray-600 dark:group-hover:text-gray-400'
              ]"></i>
        </div>
    </div>
</ng-template>

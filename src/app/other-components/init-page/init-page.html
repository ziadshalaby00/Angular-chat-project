@if (authApi.verifyloading()) {
  <div 
    class="fixed inset-0 z-10000 flex flex-col justify-center items-center 
           bg-linear-to-br from-sky-50 to-blue-100 
           dark:from-slate-900 dark:via-slate-800 dark:to-slate-900
           backdrop-blur-sm animate-fade-in"
    role="status"
    aria-label="Session initialization in progress"
  >
    
    <!-- Logo/Brand Section -->
    <div class="mb-12 text-center space-y-4">
      <!-- Application Logo/Icon -->
      <div class="flex justify-center mb-2">
        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full 
                    bg-linear-to-r from-sky-500 to-emerald-500 
                    flex items-center justify-center shadow-lg">
          <i class="fas fa-atom text-white text-2xl sm:text-3xl"></i>
        </div>
      </div>
      
      <!-- Welcome Title -->
      <h1 
        class="text-4xl sm:text-5xl md:text-6xl font-bold 
               bg-linear-to-r from-sky-600 to-emerald-600 
               dark:from-sky-400 dark:to-emerald-400 
               bg-clip-text text-transparent
               animate-pulse-subtle"
      >
        Welcome To Proton
      </h1>
      
      <!-- Subtitle -->
      <p class="text-gray-600 dark:text-gray-400 text-lg font-medium">
        Secure Communication Platform
      </p>
    </div>
    
    <!-- Main Spinner -->
    <ZS-spinner
      [loading]="true"
      type="bars"
      color="emerald"
      size="lg"
    >
    </ZS-spinner>
    
    <!-- Status Messages -->
    <div class="mt-8 text-center space-y-3">
      <!-- Primary Status Message -->
      <p class="text-gray-700 dark:text-gray-300 text-lg font-medium">
        Initializing your secure session...
      </p>
      
      <!-- Secondary Status (Optional - can show progress steps) -->
      <div class="text-sm text-gray-600 dark:text-gray-400 space-y-1">
        <p class="flex items-center justify-center gap-2">
          <i class="fas fa-shield-check text-emerald-500"></i>
          <span>Establishing encrypted connection</span>
        </p>
        <p class="flex items-center justify-center gap-2">
          <i class="fas fa-user-check text-sky-500"></i>
          <span>Verifying your identity</span>
        </p>
      </div>
    </div>
    
    <!-- Progress Bar (Optional Visual Indicator) -->
    <div class="mt-10 w-64 sm:w-80 max-w-md">
      <div class="h-1.5 w-full bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden">
        <div class="h-full w-1/3 bg-linear-to-r from-sky-500 to-emerald-500 
                    animate-progress rounded-full"></div>
      </div>
    </div>
    
    <!-- Footer Note -->
    <p class="mt-6 text-xs text-gray-500 dark:text-gray-500">
      Please wait while we prepare your environment...
    </p>
    
  </div>
}

<!-- Remove Chat Modal -->
<ZS-modal
  [(open)]="editMessageModal"
  [showHeader]="false"
  (cancelEv)="editMessageModal.set(false)"
  [confirmConfig]="{
    text: 'Edit Message',
    btnStyle: 'primary',
  }"
  (confirmEv)="EditMessage()"
  [modalStyle]="'primary'"
  modalSize="md"
  modalClass="border-2 border-red-200 dark:border-red-800/50"
  bodyClass="p-6"
>
  <div class="flex flex-col gap-3 items-center text-center">
    <!-- New Message -->
    <ZS-input
    [label]="'Message'"
    [type]="'text'"
    [inputStyle]="'secondary'"
    [required]="true"
    class="w-full"
    [(value)]="newMessage"
    >
    <!-- (changedEv)="changeUpdateAccValues($event, 'fullname')" -->
    </ZS-input>
  </div>
</ZS-modal>

<!-- Loader Icon Template -->
<ng-template #loaderIcon>
    <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
</ng-template>

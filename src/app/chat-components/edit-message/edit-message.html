<!-- Remove Chat Modal -->
<ZS-modal
  [(open)]="editMessageModal"
  [showHeader]="false"
  (cancelEv)="editMessageModal.set(false)"
  [confirmConfig]="{
    text: 'Edit Message',
    btnStyle: 'primary',
  }"
  (confirmEv)="EditMessage()"
  [modalStyle]="'primary'"
  modalSize="md"
  modalClass="border-2 border-red-200 dark:border-red-800/50"
  bodyClass="p-6"
>
  <div class="flex-1 min-w-0">
    <textarea
      #messageInput
      (input)="onInput($event)"
      [value]="newMessage()"
      rows="1"
      class="w-full scroll scroll-success bg-transparent border outline-none resize-none 
      text-gray-800 dark:text-gray-200 placeholder-gray-400 dark:placeholder-gray-500 
      p-2 text-base leading-relaxed max-h-32"
    ></textarea>
  </div>
</ZS-modal>

<!-- Loader Icon Template -->
<ng-template #loaderIcon>
    <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
</ng-template>

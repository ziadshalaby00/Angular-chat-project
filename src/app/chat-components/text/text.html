<div
  class="flex"
  [ngClass]="isUserMessage() ? 'pl-1.5 justify-start' : 'pr-1 justify-end'"
>
  <div
    class="relative px-3 py-2 max-w-[75%] rounded-lg wrap-break-word text-sm leading-tight
           text-gray-800 dark:text-white transition-colors duration-300
           bubble"
    [ngClass]="isUserMessage()
      ? 'bg-green-300 dark:bg-green-700 rounded-tl-none'
      : 'bg-gray-300 dark:bg-gray-700 rounded-tr-none'
    "
  >
    <!-- arrow for message -->
    <div
      class="absolute top-0 w-0 h-0 transition-colors duration-300"
      [ngClass]="isUserMessage()
        ? '-left-2 border-8 border-transparent border-t-green-300 dark:border-t-green-700'
        : '-right-2 border-8 border-transparent border-t-gray-300 dark:border-t-gray-700'
      "
    ></div>

    <p>{{ item().text_message.content }}</p>
  </div>
</div>

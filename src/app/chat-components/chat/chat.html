<div class="h-full w-full px-3">
  @if(!chatService.currentChat()) {
    <div class="w-full h-full text-3xl text-red-700 flex justify-center items-center">
      You are not in any chat
    </div>
  }@else {
    @if(chatService.getChatMessagesLoading()) {
      <div class="h-full w-full flex items-center justify-center">
        <div class="relative">
          <ZS-spinner
          [loading]="true"
          [type]="'pulse'"
          [color]="'green'"
          ></ZS-spinner>
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="size-10 rounded-full bg-green-500/15 dark:bg-green-500/20
            animate-pulse"></div>
          </div>
        </div>
      </div>
    }@else {
      <div class="h-full w-full">
        <div class="w-full h-full text-3xl text-green-700 flex justify-center items-center">
          Messages
        </div>
      </div>
    }
  }
</div>

<!-- Onthor Button To Open Side Bar -->
<div class="
    absolute
    right-0
    top-1/2
    -translate-y-1/2
    w-8
    py-2
    bg-gray-200 dark:bg-gray-700
    flex items-center justify-center
    rounded-l-xl
    shadow-md
    hover:opacity-90
    hover:cursor-pointer
    transition-opacity 
    duration-300
"
[ngClass]="[
    openSide()
    ? 'opacity-0 pointer-events-none' 
    : 'opacity-60 pointer-events-auto'
]"
(click)="openSide.set(!openSide())"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M4 4m0 2a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z"
    />
    <path d="M9 4l0 16" />
  </svg>
</div>

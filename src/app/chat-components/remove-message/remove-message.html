<!-- Remove Chat Modal -->
<ZS-modal
  [(open)]="removeMessageModal"
  [showHeader]="false"
  (cancelEv)="removeMessageModal.set(false)"
  [confirmConfig]="{
    text: 'Remove Message',
    btnStyle: 'danger',
  }"
  (confirmEv)="RemoveMessage()"
  [modalStyle]="'danger'"
  modalSize="md"
  modalClass="border-2 border-red-200 dark:border-red-800/50"
  bodyClass="p-6"
>
  <div class="flex flex-col gap-3 items-center text-center">
    <!-- Warning Icon -->
    <div class="relative">
      <div class="size-20 rounded-full bg-linear-to-br from-red-500/10 to-rose-600/10 dark:from-red-500/20 dark:to-rose-600/20 flex items-center justify-center">
        <div class="size-16 rounded-full bg-linear-to-br from-red-100 to-rose-200 dark:from-red-900/40 dark:to-rose-900/40 flex items-center justify-center">
          <i class="fa-solid fa-trash-can text-3xl text-red-600 dark:text-red-400"></i>
        </div>
      </div>
      <div class="absolute -top-1 -right-1 size-8 rounded-full bg-red-500 border-2 border-white dark:border-gray-900 flex items-center justify-center animate-pulse">
        <i class="fa-solid fa-exclamation text-xs text-white"></i>
      </div>
    </div>

    <!-- Warning Message -->
    <div class="space-y-2">
        <h3 class="text-xl font-bold text-gray-900 dark:text-white">
            Are you sure you want to delete this message?
        </h3>
    
        <div class="space-y-2">
            <p class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed mb-3">
            This message will be permanently deleted from <span class="font-semibold">both sides</span>.
            You and the other participant will no longer be able to see it.
            </p>
        </div>
    </div>
  </div>
</ZS-modal>

<!-- Loader Icon Template -->
<ng-template #loaderIcon>
    <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
</ng-template>

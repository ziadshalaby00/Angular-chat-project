<ZS-modal
[title]="'Edit Account'"
[(open)]="openUpdateAccModal"
(cancelEv)="openUpdateAccModal.set(false)"
(confirmEv)="updateAccProfile()"
[confirmConfig]="{
  text: 'Edit',
  btnStyle: 'primary',
  disabled: authApi.updateProfileLoading(),
  iconTpl: authApi.updateProfileLoading() ? loaderIconTpl : null
}"
[cancelConfig]="{
  disabled: authApi.updateProfileLoading(),
}"
[showCancelIcon]="!authApi.updateProfileLoading()"
[closeOnOverlay]="!authApi.updateProfileLoading()"
[modalStyle]="'primary'"
>
  <div class="flex flex-col gap-4 text-gray-800 dark:text-gray-300">
    <ZS-input
    [label]="'Full Name'"
    [iconTpl]="userIcon"
    [type]="'text'"
    [inputStyle]="'secondary'"

    [required]="true"
    [(value)]="updateAccForm.fields.fullname().value"
    (changedEv)="changeUpdateAccValues($event, 'fullname')"
    >
    </ZS-input>
    
    <ZS-input
    [label]="'Username'"
    [iconTpl]="userIcon"
    [type]="'text'"
    [inputStyle]="'secondary'"

    [required]="true"
    [(value)]="updateAccForm.fields.username().value"
    (changedEv)="changeUpdateAccValues($event, 'username')"
    >
    </ZS-input>
    
    <ZS-input
    [label]="'Email'"
    [hint]="'Enter a unique email.'"
    [iconTpl]="envelopeIcon"
    [type]="'email'"
    [inputStyle]="'secondary'"

    [required]="true"
    [(value)]="updateAccForm.fields.email().value"
    (changedEv)="changeUpdateAccValues($event, 'email')"
    >
    </ZS-input>
    
    <ZS-input
    [label]="'Bio'"
    [hint]="'Write a short bio about yourself'"
    [iconTpl]="messageIcon"
    [type]="'text'"
    [inputStyle]="'secondary'"

    [(value)]="updateAccForm.fields.bio().value"
    (changedEv)="changeUpdateAccValues($event, 'bio')"
    >
    </ZS-input>
  </div>
</ZS-modal>

<!-- Loader Icon -->
<ng-template #loaderIcon>
  <i class="fa fa-spinner fa-spin"></i>
</ng-template>

<!-- User Icon -->
<ng-template #userIcon>
  <i class="fas fa-user mr-1.5"></i>
</ng-template>
<!-- Envelope Icon -->
<ng-template #envelopeIcon>
  <i class="fas fa-envelope mr-1.5"></i>
</ng-template>
<!-- Message Icon -->
<ng-template #messageIcon>
  <i class="fa-solid fa-message mr-1.5"></i>
</ng-template>

<!-- Change Password Modal -->
<ZS-modal
  [title]="'Change Password'"
  [(open)]="openChangePassModal"
  (cancelEv)="openChangePassModal.set(false)"
  (confirmEv)="changePass()"
  [confirmConfig]="{
    text: 'Change',
    btnStyle: 'warning',
    disabled: authApi.updateProfileLoading(),
    iconTpl: authApi.updateProfileLoading() ? loaderIconTpl : null
  }"
  [cancelConfig]="{
    disabled: authApi.updateProfileLoading()
  }"
  [showCancelIcon]="!authApi.updateProfileLoading()"
  [closeOnOverlay]="!authApi.updateProfileLoading()"
  [modalStyle]="'warning'"
>
  <div class="flex flex-col gap-4 text-yellow-600 dark:text-yellow-500">
    
    <!-- Old Password Input -->
    <ZS-input
      [label]="'Old Password'"
      placeholder="Enter your password"
      [iconTpl]="lockIcon"
      [type]="'password'"
      [inputStyle]="'warning'"

      [formField]="changePassForm.old_password"
    >
    </ZS-input>

    <!-- New Password Input -->
    <ZS-input 
      [label]="'New Password'"
      placeholder="Enter the new password"
      [iconTpl]="lockIcon"
      [type]="'password'"
      [inputStyle]="'warning'"
      [formField]="changePassForm.password"
    >
    </ZS-input>

    <!-- Confirm New Password Input -->
    <ZS-input 
      [label]="'Confirm New Password'"
      placeholder="Confirm the new password"
      [iconTpl]="lockIcon"
      [type]="'password'"
      [inputStyle]="'warning'"
      [formField]="changePassForm.conf_password"
    >
    </ZS-input>
    
  </div>
</ZS-modal>

<!-- Icons Templates -->
<ng-container>
  <!-- Loader Icon Template -->
  <ng-template #loaderIcon>
    <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
  </ng-template>

  <!-- Lock Icon Template -->
  <ng-template #lockIcon>
    <i class="fas fa-lock mr-1.5" aria-hidden="true"></i>
  </ng-template>
</ng-container>

<ZS-modal
[title]="'Edit Image'"
[(open)]="openEditImgModal"
(cancelEv)="openEditImgModal.set(false)"
(confirmEv)="editImgProfile()"
[confirmConfig]="{
  text: 'Edit',
  btnStyle: 'primary',
  disabled: authApi.updateProfileLoading(),
  iconTpl: authApi.updateProfileLoading() ? loaderIconTpl : null
}"
[cancelConfig]="{
  disabled: authApi.updateProfileLoading(),
}"
[showCancelIcon]="!authApi.updateProfileLoading()"
[closeOnOverlay]="!authApi.updateProfileLoading()"
[modalStyle]="'primary'"
>
  <div class="flex flex-col gap-4">
    <ZS-file
    [disabled]="authApi.updateProfileLoading()"
    [(touched)]="EditImgForm.fields.user_image().touched"

    [required]="true"
    [inputStyle]="'primary'"
    (changeEv)="changeEditImgcValues($event, 'user_image')"

    [(files)]="filesType"
    >
    </ZS-file>

    <!-- or -->
    <app-or></app-or>

    <ZS-button
    [disabled]="authApi.updateProfileLoading()"
    btnStyle="danger"
    (clickedEv)="confRemUserImg.set(true)"
    >
      Remove Picture
    </ZS-button>
  </div>
</ZS-modal>

<ZS-modal
[(open)]="confRemUserImg"
[confirmConfig]="{
  text: 'Remove',
  btnStyle: 'danger',
  disabled: authApi.remImgProfileLoading(),
  iconTpl: authApi.remImgProfileLoading() ? loaderIconTpl : null
}"
[cancelConfig]="{
  disabled: authApi.remImgProfileLoading(),
}"
[closeOnOverlay]="!authApi.remImgProfileLoading()"
[modalStyle]="'danger'"

(cancelEv)="confRemUserImg.set(false)"
(confirmEv)="removeUserImg()"

[showHeader]="false"
>
  <p>
    Do you really want to remove your profile picture?
  </p>
</ZS-modal>

<!-- Loader Icon -->
<ng-template #loaderIcon>
  <i class="fa fa-spinner fa-spin"></i>
</ng-template>

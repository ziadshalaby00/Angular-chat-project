<!-- User Avatar -->
@if(participant()?.user_info?.user_image) {
    <img
        [src]="participant()?.user_info?.user_image"
        alt="User image"
        [ngClass]="[
            isCurrentChat()
                ? 'group-hover/card:border-green-600 dark:group-hover/card:border-green-500' 
                : 'group-hover/card:border-blue-600 dark:group-hover/card:border-blue-500',
        ]"
        class="size-14 min-w-14 rounded-full shadow-lg border-2 border-white 
        dark:border-gray-800 object-cover transition-colors duration-300"
    >
}
@else if(participant()?.user_info?.is_deleted) {
    <div
        class="size-14 min-w-14 text-2xl rounded-full shadow-lg bg-linear-to-br 
        from-red-500 to-rose-600 flex items-center justify-center text-white 
        border-2 border-white dark:border-gray-800 relative"
        aria-hidden="true"
    >
        <i class="fa-solid fa-user-slash"></i>
        <div class="absolute -bottom-1 -right-1 size-3.5 bg-red-600 rounded-full 
        border-2 border-white dark:border-gray-800"></div>
    </div>
}
@else {
    <div
        [ngClass]="[
            isCurrentChat()
                ? 'from-green-500  to-emerald-600 group-hover/card:from-green-600 group-hover/card:to-emerald-700 ' 
                : 'from-blue-500 to-indigo-600 group-hover/card:from-blue-600 group-hover/card:to-indigo-700 ',
        ]"
        class="size-14 min-w-14 text-2xl rounded-full shadow-lg bg-linear-to-br 
            flex items-center justify-center text-white border-2 border-white 
        dark:border-gray-800 font-bold transition-all duration-300"
        aria-hidden="true"
    >
        {{ participant()?.user_info?.fullname?.charAt(0)?.toUpperCase() }}
    </div>
}
